<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2b2a">
<title>青禾库存 · 工作台</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --sidebar-bg:#1a2b2a;--sidebar-text:#a3b8b0;--sidebar-hover:#2d423f;--sidebar-active:#2e7d6b;
  --bg:#f4f7f6;--card:#fff;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --border:#e2e8f0;--primary:#2e7d6b;--primary-hover:#256557;
  --danger:#dc2626;--warning:#d97706;--success:#166534;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
input,textarea,select,button{font-family:inherit;font-size:14px}

.app-container{display:flex;height:100vh;width:100vw}
.sidebar{width:240px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;padding:20px 0}
.logo{display:flex;align-items:center;gap:10px;padding:0 24px 30px;color:#fff}
.logo-icon{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.logo-text h1{font-size:16px;margin:0;font-weight:700}
.logo-text p{font-size:11px;margin:2px 0 0;opacity:.6;letter-spacing:.5px}
.nav-menu{flex:1;display:flex;flex-direction:column;gap:4px;padding:0 12px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:.2s;border:none;background:transparent;color:inherit;text-align:left;width:100%}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#fff}
.sidebar-footer{padding:20px 24px;font-size:12px;opacity:.6;line-height:1.6;border-top:1px solid rgba(255,255,255,.08)}

.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.page-body{padding:20px 28px;overflow-y:auto;flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:#fff;color:var(--text);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.outline{border-color:var(--border);color:var(--text-2)}
.btn.outline:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:6px}
.btn.icon-btn{padding:6px;width:36px;height:36px;flex-shrink:0}
.btn svg{width:16px;height:16px}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.card-title .sub{font-size:12px;font-weight:400;color:var(--text-3)}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px}
.stat-card .lbl{font-size:13px;color:var(--text-2);margin-bottom:6px}
.stat-card .val{font-size:24px;font-weight:700;color:var(--text)}
.stat-card .val.warning{color:var(--warning)}
.stat-card .val.danger{color:var(--danger)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:12px 14px;font-size:12px;font-weight:600;color:var(--text-2);background:#f8fafc;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
/* 类别分组行 */
tr.cat-group-row td{
  background:#eef4f2;
  font-weight:700;
  font-size:12.5px;
  color:var(--primary);
  padding:8px 14px;
  letter-spacing:.5px;
  border-bottom:1px solid #d4e3de;
}
tr.cat-group-row:hover td{background:#eef4f2}
.product-cell{display:flex;align-items:center;gap:12px}
.product-img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#f1f5f9;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:10px;cursor:pointer;transition:.15s}
.product-img:hover{transform:scale(1.08);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.product-info .name{font-weight:600;color:var(--text)}
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;background:#f1f5f9;color:var(--text-2)}
.tag.green{background:#dcfce7;color:var(--success)}
.tag.orange{background:#fef3c7;color:var(--warning)}
.tag.red{background:#fee2e2;color:var(--danger)}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.num.text-danger{color:var(--danger)}
.num.text-warning{color:var(--warning)}
.action-col{text-align:right;white-space:nowrap}
.action-col .btn{margin-left:2px}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search{position:relative;flex:1;min-width:180px}
.toolbar .search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:8px;outline:none}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3)}
.toolbar select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;outline:none;background:#fff;color:var(--text)}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.modal.show{opacity:1;pointer-events:auto}
.modal-content{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px;transform:translateY(20px);transition:.3s}
.modal.show .modal-content{transform:none}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h3{margin:0;font-size:18px}
.close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-3);line-height:1;padding:0 4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;outline:none;transition:.15s;background:#fff}
.field input:focus,.field select:focus{border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.img-preview{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);margin-top:8px;display:none}

#reader{
  width:100%;
  max-width:340px;
  height:260px;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  margin:0 auto 16px auto;
  display:flex;
  align-items:center;
  justify-content:center;
}
#reader video{
  object-fit:cover;
  width:100% !important;
  height:100% !important;
  max-width:100%;
}
#cameraVideo{width:100%;border-radius:8px;background:#000;max-height:60vh;object-fit:cover}

.barcode-showcase{text-align:center;padding:20px 10px;background:#f8fafc;border-radius:12px;border:1px dashed var(--border);margin-bottom:16px}
.barcode-showcase svg{max-width:100%;height:auto}
.barcode-showcase .barcode-sku{font-family:ui-monospace,monospace;font-size:14px;color:var(--text-2);margin-top:8px;letter-spacing:1px}
.barcode-showcase .barcode-name{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text)}

.image-viewer{
  position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:.2s;padding:16px;
}
.image-viewer.show{opacity:1;pointer-events:auto}
.image-viewer img{
  max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
}
.image-viewer .close-viewer{
  position:absolute;top:16px;right:16px;
  width:40px;height:40px;border-radius:50%;border:0;
  background:rgba(255,255,255,.15);color:#fff;font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.image-viewer .close-viewer:active{background:rgba(255,255,255,.3)}

.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty svg{width:48px;height:48px;opacity:.3;margin-bottom:12px}
.empty .big-hint{font-size:15px;color:var(--text-2);font-weight:500}

.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:#1e293b;color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

@media(max-width:768px){
  .app-container{flex-direction:column}
  .sidebar{width:100%;height:auto;padding:12px 16px;flex-direction:row;align-items:center;justify-content:space-between;overflow-x:auto}
  .logo{padding:0;margin-right:16px}
  .logo-text{display:none}
  .nav-menu{flex-direction:row;padding:0;gap:6px}
  .nav-item{padding:8px 12px;font-size:13px;white-space:nowrap}
  .nav-item span{display:none}
  .nav-item svg{width:16px;height:16px}
  .sidebar-footer{display:none}
  .page-body{padding:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .toolbar .search{min-width:100%}
}
</style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">青</div>
      <div class="logo-text">
        <h1>青禾库存</h1>
        <p>STOCKROOM · 工作台</p>
      </div>
    </div>
    <nav class="nav-menu">
      <button class="nav-item active" data-page="home" onclick="go('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1z"/></svg>
        <span>工作概览</span>
      </button>
      <button class="nav-item" data-page="stock" onclick="go('stock')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-4.5L3 8v8l9 4.5 9-4.5z"/><path d="M3 8l9 4.5L21 8M12 12.5V21"/></svg>
        <span>库存商品</span>
      </button>
      <button class="nav-item" data-page="restock" onclick="go('restock')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>补货清单</span>
      </button>
      <button class="nav-item" data-page="history" onclick="go('history')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>库存流水</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      数据保存于此设备<br>
      清除浏览器网站数据会删除库存，<br>请定期下载备份文件。
    </div>
  </aside>

  <main class="main-content">
    <div class="page-body" id="pageContent"></div>
  </main>
</div>

<!-- 商品模态框 -->
<div class="modal" id="itemModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="itemModalTitle">新增商品</h3>
      <button class="close-btn" onclick="closeItemModal()">✕</button>
    </div>
    <form id="itemForm" onsubmit="saveItem(event)">
      <div class="grid2">
        <div class="field">
          <label>商品名称 *</label>
          <input id="fName" required maxlength="50" placeholder="例如：低脂纯牛奶">
        </div>
        <div class="field">
          <label>分类</label>
          <select id="fCat" onchange="onCatSelectChange(this)"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>条码 / 编号</label>
          <input id="fSku" maxlength="30" placeholder="留空自动生成">
        </div>
        <div class="field">
          <label>单位</label>
          <input id="fUnit" maxlength="8" placeholder="件 / 盒 / 罐">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>当前库存</label>
          <input id="fQty" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label>安全库存（预警线）</label>
          <input id="fMin" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>目标库存（补货后）</label>
          <input id="fTarget" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label>进价（RM）</label>
          <input id="fCost" type="number" min="0" step="0.01" value="0" inputmode="decimal">
        </div>
      </div>
      <div class="field">
        <label>售价（RM）</label>
        <input id="fPrice" type="number" min="0" step="0.01" value="0" inputmode="decimal">
      </div>
      <div class="field">
        <label>商品图片</label>
        <input type="file" id="fImageGallery" accept="image/*" onchange="handleImageUpload(event)" style="display:none">
        <div style="display:flex; gap:8px; margin-top:6px;">
          <button type="button" class="btn outline" style="flex:1" onclick="openCamera()">📷 拍照</button>
          <button type="button" class="btn outline" style="flex:1" onclick="document.getElementById('fImageGallery').click()">🖼️ 相册</button>
        </div>
        <img id="previewImg" class="img-preview">
        <button type="button" class="btn sm danger" style="margin-top:6px;display:none" id="removeImgBtn" onclick="removeImage()">删除图片</button>
      </div>
      <div class="field">
        <label>备注</label>
        <input id="fNote" maxlength="80" placeholder="可选">
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button type="button" class="btn outline" style="flex:1" onclick="closeItemModal()">取消</button>
        <button type="submit" class="btn primary" style="flex:1">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 扫码模态框 -->
<div class="modal" id="scannerModal">
  <div class="modal-content" style="max-width:440px;text-align:center;">
    <div class="modal-header">
      <h3>📷 扫描条码</h3>
      <button class="close-btn" onclick="closeScan()">✕</button>
    </div>
    <div id="reader"></div>
    <p style="text-align:center;font-size:13px;color:var(--text-3);margin:0;">将条码放入框内即可自动扫描</p>
  </div>
</div>

<!-- 条码显示模态框 -->
<div class="modal" id="barcodeModal">
  <div class="modal-content" style="max-width:480px">
    <div class="modal-header">
      <h3>🏷️ 商品条码</h3>
      <button class="close-btn" onclick="closeBarcode()">✕</button>
    </div>
    <div class="barcode-showcase" id="barcodeShowcase">
      <div class="barcode-name" id="bcName">—</div>
      <svg id="barcodeSvg"></svg>
      <div class="barcode-sku" id="bcSku">—</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn outline" style="flex:1" onclick="printBarcode()">🖨️ 打印条码</button>
      <button class="btn outline" style="flex:1" onclick="downloadBarcode()">📥 下载图片</button>
      <button class="btn outline" style="flex:1" onclick="assignNewSku()">🔄 重新生成</button>
    </div>
  </div>
</div>

<!-- 拍照模态框 -->
<div class="modal" id="cameraModal">
  <div class="modal-content" style="max-width:440px; text-align:center;">
    <h3 style="margin-top:0;">📷 拍照</h3>
    <video id="cameraVideo" autoplay playsinline></video>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn outline" style="flex:1" onclick="closeCamera()">取消</button>
      <button class="btn primary" style="flex:1" onclick="takePhoto()">📸 确认拍照</button>
    </div>
  </div>
</div>

<!-- 出入库模态框 -->
<div class="modal" id="stockModal">
  <div class="modal-content" style="max-width:400px">
    <div class="modal-header">
      <h3 id="stockModalTitle">库存变动</h3>
      <button class="close-btn" onclick="closeStockModal()">✕</button>
    </div>
    <div style="background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-weight:700" id="smName">—</div>
      <div style="font-size:12px;color:var(--text-3);margin-top:4px" id="smSku"></div>
      <div style="margin-top:8px;font-size:13px">当前库存：<b id="smCurrent" style="color:var(--primary)">0</b></div>
    </div>
    <div class="grid2" style="margin-bottom:16px">
      <button type="button" id="typeIn" class="btn primary" onclick="setStockType('in')">入库 +</button>
      <button type="button" id="typeOut" class="btn outline" onclick="setStockType('out')">出库 −</button>
    </div>
    <div class="field">
      <label>数量 *</label>
      <input id="smQty" type="number" min="1" step="1" value="1" inputmode="numeric">
    </div>
    <div class="field">
      <label>备注</label>
      <input id="smNote" maxlength="60" placeholder="例如：供应商补货 / 客户订单">
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button type="button" class="btn outline" style="flex:1" onclick="closeStockModal()">取消</button>
      <button type="button" class="btn primary" style="flex:1" onclick="confirmStock()">确认</button>
    </div>
  </div>
</div>

<!-- 图片放大查看器 -->
<div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
  <button class="close-viewer" onclick="closeImageViewer()">✕</button>
  <img id="imageViewerImg" src="" alt="">
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const KEY='inventory_app_v2';
let items=[],records=[],editingId=null,stockItemId=null,stockType='in';
let html5QrCode=null,currentImageBase64=null,cameraStream=null;
let stockCatFilter='';
let restockCatFilter='';
let currentBarcodeId=null;
let hiddenRestockIds = new Set();

function save(){try{localStorage.setItem(KEY,JSON.stringify({items,records}))}catch(e){toast('保存失败！存储空间可能已满')}}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return false;const d=JSON.parse(r);items=Array.isArray(d.items)?d.items:[];records=Array.isArray(d.records)?d.records:[];return true}catch(e){return false}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return 'RM '+(Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtNum(n){return (Number(n)||0).toLocaleString('zh-CN')}
function pad2(n){return String(n).padStart(2,'0')}
function fmtTime(t){const d=new Date(t),now=new Date();const same=d.toDateString()===now.toDateString();
const tm=pad2(d.getHours())+':'+pad2(d.getMinutes());
if(same)return '今天 '+tm;
const y=new Date(now);y.setDate(y.getDate()-1);
if(d.toDateString()===y.toDateString())return '昨天 '+tm;
return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${tm}`}

function toast(msg){const w=document.getElementById('toastWrap');const el=document.createElement('div');
el.className='toast';el.textContent=msg;w.appendChild(el);
setTimeout(()=>{el.style.transition='opacity .25s, transform .25s';el.style.opacity='0';
el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),260)},2000)}

/* ========== 图片放大查看器 ========== */
function showImageViewerById(id){
  const p = items.find(x => x.id === id);
  if(p && p.image){
    document.getElementById('imageViewerImg').src = p.image;
    document.getElementById('imageViewer').classList.add('show');
  }
}
function closeImageViewer(){

/* ========== 条码生成 ========== */
function generateBarcodeNumber(){
  let barcode;
  do{
    barcode = '';
    for(let i=0;i<12;i++) barcode += Math.floor(Math.random()*10);
  }while(items.some(p=>p.sku === barcode));
  return barcode;
}

/* ========== 商品模态框里的分类 selector ========== */
function buildCatOptions(currentCat){
  const cats=[...new Set(items.map(p=>p.cat).filter(Boolean))];
  const sel = document.getElementById('fCat');
  let html = '<option value="">— 未分类 —</option>';
  cats.forEach(c=>{
    html += `<option value="${esc(c)}" ${c===currentCat?'selected':''}>${esc(c)}</option>`;
  });
  html += `<option value="__new__">➕ 新增类别…</option>`;
  sel.innerHTML = html;
  if(currentCat && !cats.includes(currentCat)){
    sel.innerHTML = `<option value="">— 未分类 —</option><option value="${esc(currentCat)}" selected>${esc(currentCat)}</option>` + cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('') + `<option value="__new__">➕ 新增类别…</option>`;
  }
}

function onCatSelectChange(sel){
  if(sel.value === '__new__'){
    const newCat = prompt('请输入新的类别名称：');
    if(newCat && newCat.trim()){
      const v = newCat.trim();
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v; opt.selected = true;
      sel.insertBefore(opt, sel.querySelector('option[value="__new__"]'));
      toast('已新增类别：'+v);
    } else {
      sel.value = '';
    }
  }
}

/* ========== 按类别排序（让同类别相邻） ========== */
function sortByCategory(arr){
  return arr.slice().sort((a,b)=>{
    const ca = a.cat || '~未分类';
    const cb = b.cat || '~未分类';
    if(ca !== cb) return ca.localeCompare(cb, 'zh-CN');
    return (a.name||'').localeCompare(b.name||'', 'zh-CN');
  });
}

function filterStock(){
  stockCatFilter = document.getElementById('catFilter')?.value || '';
  const wrap = document.getElementById('stockTableWrap');
  const emptyBox = document.getElementById('stockEmpty');
  
  // 所有类别 或 具体类别都显示
  let filtered = !stockCatFilter ? items.slice() : items.filter(p => p.cat === stockCatFilter);
  // 按类别排序，让同类别商品自动聚在一起
  filtered = sortByCategory(filtered);
  
  const tbody=document.getElementById('stockTableBody');
  
  if(filtered.length === 0){
    if(wrap) wrap.style.display = 'none';
    if(emptyBox){
      emptyBox.style.display = 'block';
      emptyBox.innerHTML = '<div class="big-hint">该类别下暂无商品</div>';
    }
    return;
  }
  
  if(wrap) wrap.style.display = 'block';
  if(emptyBox) emptyBox.style.display = 'none';
  
  let html = '';
  let lastCat = null;
  filtered.forEach(p=>{
    const catKey = p.cat || '未分类';
    // 每遇到一个新类别，插入一行类别标题
    if(catKey !== lastCat){
      html += `<tr class="cat-group-row"><td colspan="5">📁 ${esc(catKey)}</td></tr>`;
      lastCat = catKey;
    }
    
    const target=Number(p.target)||Number(p.min)*2||10;
    const suggest=Math.max(0,target-Number(p.qty));
    let suggestHtml='<span class="num" style="color:var(--success);font-size:15px">0</span>';
    if(suggest>0) suggestHtml=`<span class="num text-warning" style="font-size:15px">${suggest}</span>`;
    
    const img = p.image
      ? `<img src="${p.image}" class="product-img" onclick="showImageViewerById('${p.id}')" title="点击放大">`
      : `<div class="product-img">无图</div>`;
    
    html += `
      <tr>
        <td><div class="product-cell">${img}<div class="product-info"><div class="name">${esc(p.name)}</div></div></div></td>
        <td>${suggestHtml}</td>
        <td><span class="num ${Number(p.min)>0&&Number(p.qty)<=Number(p.min)?'text-danger':''}">${p.qty}</span></td>
        <td>${money(p.price)}</td>
        <td class="action-col">
          <button class="btn sm outline icon-btn" onclick="openStockModal('${p.id}','out')" title="出库">−</button>
          <button class="btn sm primary icon-btn" onclick="openStockModal('${p.id}','in')" title="入库">+</button>
          <button class="btn sm outline icon-btn" onclick="openItemModal('${p.id}')" title="编辑">✏️</button>
          <button class="btn sm danger icon-btn" onclick="deleteItem('${p.id}')" title="删除">🗑️</button>
        </td>
      </tr>`;
  });
  tbody.innerHTML = html;
}

function deleteItem(id){
  const p = items.find(x => x.id === id);
  if(!p) return;
  if(!confirm(`确定删除「${p.name}」吗？\n\n删除后该商品和它的库存数据都会消失，此操作不可撤销。`)) return;
  items = items.filter(x => x.id !== id);

function filterRestock(){
  restockCatFilter=document.getElementById('restockCatFilter')?.value||'';
  let lowItems=items.filter(p=>{
    const min = Number(p.min) || 0;
    const qty = Number(p.qty) || 0;
    const target = Number(p.target) || min * 2 || 10;
    return (min > 0 && qty <= min) || (min === 0 && qty < target - 1);
  });
  lowItems = lowItems.filter(p => !hiddenRestockIds.has(p.id));
  if(restockCatFilter){ lowItems=lowItems.filter(p=>p.cat===restockCatFilter); }
  lowItems = sortByCategory(lowItems);
  const tbody=document.getElementById('restockBody');
  if(!tbody) return;
  if(lowItems.length===0){
    tbody.innerHTML='<tr><td colspan="5"><div class="empty">暂无需要补货的商品</div></td></tr>';
    return;
  }
  
  let html='';
  let lastCat=null;
  lowItems.forEach(p=>{
    const catKey = p.cat || '未分类';
    if(catKey !== lastCat){
      html += `<tr class="cat-group-row"><td colspan="5">📁 ${esc(catKey)}</td></tr>`;
      lastCat = catKey;
    }
    const target=Number(p.target)||Number(p.min)*2||10;
    const suggest=Math.max(0,target-Number(p.qty));
    let suggestHtml='<span class="num" style="color:var(--success);font-size:15px">0</span>';
    if(suggest>0) suggestHtml=`<span class="num text-warning" style="font-size:15px">${suggest}</span>`;
    
    const img = p.image
      ? `<img src="${p.image}" class="product-img" onclick="showImageViewerById('${p.id}')" title="点击放大">`
      : `<div class="product-img">无图</div>`;
    
    html += `
      <tr>
        <td><div class="product-cell">${img}<div class="product-info"><div class="name">${esc(p.name)}</div></div></div></td>
        <td>${suggestHtml}</td>
        <td><span class="num ${Number(p.qty)<=Number(p.min)?'text-danger':''}">${p.qty}</span></td>
        <td>${money(p.price)}</td>
        <td class="action-col">
          <button class="btn sm outline icon-btn" onclick="confirmRestock('${p.id}')" title="确认到货">✅</button>
          <button class="btn sm outline icon-btn" onclick="hideRestockRow('${p.id}')" title="从清单隐藏（不影响数据）">🗑️</button>
        </td>
      </tr>`;
  });
  tbody.innerHTML = html;
}

function confirmRestock(id){
  const p=items.find(x=>x.id===id);if(!p)return;
  const target=Number(p.target)||Number(p.min)*2||10;
  const suggest=Math.max(0,target-Number(p.qty));
  if(suggest<=0){toast('当前库存已达标');return}
  if(!confirm(`确认到货「${p.name}」？\n本次补货：${suggest}\n补货后库存：${target}`))return;
  const before=Number(p.qty)||0;
  p.qty=target;
  records.unshift({id:uid(),itemId:p.id,name:p.name,type:'in',qty:suggest,before,after:target,note:'补货确认到货',time:Date.now()});
  save();renderPage();toast(`已到货 ${suggest}`);
}

function saveItem(e){
  e.preventDefault();
  const name=document.getElementById('fName').value.trim();
  if(!name){toast('请输入商品名称');return}
  const data={
    name,
    sku:document.getElementById('fSku').value.trim(),
    cat:document.getElementById('fCat').value,
    unit:document.getElementById('fUnit').value.trim(),
    qty:Math.max(0,parseInt(document.getElementById('fQty').value,10)||0),
    min:Math.max(0,parseInt(document.getElementById('fMin').value,10)||0),
    target:Math.max(0,parseInt(document.getElementById('fTarget').value,10)||0),
    cost:Math.max(0,parseFloat(document.getElementById('fCost').value)||0),
    price:Math.max(0,parseFloat(document.getElementById('fPrice').value)||0),
    note:document.getElementById('fNote').value.trim(),
    image:currentImageBase64
  };
  
  if(!data.sku) data.sku = generateBarcodeNumber();
  
  if(editingId){
    const idx=items.findIndex(x=>x.id===editingId);
    if(idx>=0){
      const oldQty=Number(items[idx].qty)||0;
      if(oldQty!==data.qty){
        const diff=data.qty-oldQty;
        records.unshift({id:uid(),itemId:editingId,name:data.name,type:diff>0?'in':'out',qty:Math.abs(diff),before:oldQty,after:data.qty,note:'编辑商品时调整库存',time:Date.now()});
      }
      items[idx]={...items[idx],...data};
    }
    toast('已保存修改');
  }else{
    const ni={id:uid(),...data,createdAt:Date.now()};
    items.unshift(ni);
    if(data.qty>0){records.unshift({id:uid(),itemId:ni.id,name:data.name,type:'in',qty:data.qty,before:0,after:data.qty,note:'新建商品',time:Date.now()})}
    toast('已添加商品');
  }
  save();closeItemModal();renderPage();
}

function confirmStock(){
  const p=items.find(x=>x.id===stockItemId);if(!p)return;
  const qty=parseInt(document.getElementById('smQty').value,10);
  if(!qty||qty<=0){toast('请输入有效数量');return}
  const note=document.getElementById('smNote').value.trim();
  const before=Number(p.qty)||0;
  if(stockType==='out'&&qty>before){toast('出库数量超过当前库存');return}
  const after=stockType==='in'?before+qty:before-qty;
  p.qty=after;
  records.unshift({id:uid(),itemId:p.id,name:p.name,type:stockType,qty,before,after,note,time:Date.now()});
  save();closeStockModal();renderPage();
  toast(stockType==='in'?`已入库 ${qty}`:`已出库 ${qty}`);
}

function openCamera(){
  document.getElementById('cameraModal').classList.add('show');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('当前环境不支持调用摄像头，请用相册选图');
    closeCamera();
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } })
  .then(stream => {
    cameraStream = stream;
    document.getElementById('cameraVideo').srcObject = stream;
  })
  .catch(err => {
    console.error('摄像头启动失败:', err);
    toast(err.name === 'NotAllowedError' ? '相机权限被拒绝，请在手机设置中允许使用相机' : '无法打开相机，请检查权限');
    closeCamera();
  });
}

function closeCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
  const video = document.getElementById('cameraVideo');
  if(video) video.srcObject = null;
  document.getElementById('cameraModal').classList.remove('show');
}

function takePhoto(){
  const video = document.getElementById('cameraVideo');
  if(!video || !video.videoWidth){ toast('相机未准备好'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
  document.getElementById('previewImg').src = currentImageBase64;
  document.getElementById('previewImg').style.display = 'block';
  document.getElementById('removeImgBtn').style.display = 'inline-block';
  closeCamera();
  toast('照片已拍摄');
}

function handleImageUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(event){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const MAX=400;let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h*=MAX/w;w=MAX}}else{if(h>MAX){w*=MAX/h;h=MAX}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      currentImageBase64=canvas.toDataURL('image/jpeg',0.7);
      document.getElementById('previewImg').src=currentImageBase64;
      document.getElementById('previewImg').style.display='block';
      document.getElementById('removeImgBtn').style.display='inline-block';
      toast('图片已就绪');
    };
    img.src=event.target.result;
  };
  reader.readAsDataURL(file);
}

function removeImage(){
  currentImageBase64=null;
  const galInput=document.getElementById('fImageGallery');
  if(galInput) galInput.value='';
  closeCamera();
  document.getElementById('previewImg').style.display='none';
  document.getElementById('removeImgBtn').style.display='none';
}

function startScan(){
  if(typeof Html5Qrcode==='undefined' || typeof Html5QrcodeSupportedFormats === 'undefined'){
    toast('扫码库未加载完成，请刷新重试');
    return;
  }
  document.getElementById('scannerModal').classList.add('show');
  
  setTimeout(() => {
    if(html5QrCode){ try{html5QrCode.clear()}catch(e){} }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast('当前环境不支持调用摄像头，请确认使用 HTTPS 网址');
      closeScan();
      return;
    }
    
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ];
    
    html5QrCode = new Html5Qrcode("reader", {
      formatsToSupport: formatsToSupport,
      useBarCodeDetectorIfSupported: true
    });
    
    const config = {
      fps: 30,
      qrbox: { width: 250, height: 110 },
      aspectRatio: 1.4,
      disableFlip: true
    };
    
    html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      (errorMessage) => {}
    ).catch(err => {
      console.error("摄像头启动失败：", err);
      toast(err.name === 'NotAllowedError' ? '❌ 相机权限被拒绝！请在手机设置中允许使用相机' : '❌ 摄像头启动失败，请检查手机权限');
      closeScan();
    });
  }, 400);
}

function onScanSuccess(decodedText){
  if(html5QrCode){
    html5QrCode.stop().then(()=>{
      html5QrCode.clear();
      html5QrCode=null;
    }).catch(()=>{html5QrCode=null});
  }
  document.getElementById('scannerModal').classList.remove('show');
  
  const product = items.find(p => p.sku === decodedText || p.name === decodedText);
  if(product){
    const action = confirm(`✅ 找到商品：${product.name}\n当前库存：${product.qty}\n\n点击【确定】入库\n点击【取消】出库`);
    openStockModal(product.id, action ? 'in' : 'out');
  } else {
    if(confirm(`❓ 未找到条码 [${decodedText}]\n是否新增商品？`)){
      openItemModal();
      document.getElementById('fSku').value = decodedText;
      toast('已自动填入条码');
    }
  }
}

function closeScan(){
  if(html5QrCode){
    html5QrCode.stop().then(()=>{
      html5QrCode.clear();
      html5QrCode=null;
    }).catch(()=>{html5QrCode=null});
  }
  document.getElementById('scannerModal').classList.remove('show');
}

function exportJSON(){
  if(items.length===0){toast('没有数据可导出');return}
  const data=JSON.stringify({version:2,exportedAt:new Date().toISOString(),items,records},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const d=new Date();
  a.download=`青禾库存备份_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('JSON 备份已导出');
}

async function exportExcel(){
  if(items.length===0){toast('没有数据可导出');return}
  if(typeof ExcelJS==='undefined'||typeof saveAs==='undefined'){toast('导出组件未加载完成，请刷新页面重试');return}
  
  toast('正在生成 Excel，请稍候...');
  
  const workbook=new ExcelJS.Workbook();
  const worksheet=workbook.addWorksheet('库存商品');
  
  worksheet.columns=[
    {header:'商品图片',key:'image',width:15},
    {header:'商品名称',key:'name',width:22},
    {header:'条码/编号',key:'sku',width:15},
    {header:'分类',key:'cat',width:12},
    {header:'单位',key:'unit',width:8},
    {header:'安全库存',key:'min',width:10},
    {header:'目标库存',key:'target',width:10},
    {header:'当前库存',key:'qty',width:10},
    {header:'建议补货量',key:'suggest',width:12},
    {header:'进价(RM)',key:'cost',width:10},
    {header:'售价(RM)',key:'price',width:10},
    {header:'库存成本(RM)',key:'totalCost',width:14},
    {header:'备注',key:'note',width:20}
  ];
  
  const headerRow=worksheet.getRow(1);
  headerRow.font={bold:true,color:{argb:'FFFFFFFF'}};
  headerRow.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2E7D6B'}};
  headerRow.alignment={vertical:'middle',horizontal:'center'};
  headerRow.height=25;
  
  for(let i=0;i<items.length;i++){
    const p=items[i];
    const target=Number(p.target)||Number(p.min)*2||10;
    const suggest=Math.max(0,target-Number(p.qty));
    
    const row=worksheet.addRow({
      name:p.name,
      sku:p.sku||'',
      cat:p.cat||'',
      unit:p.unit||'',
      min:Number(p.min)||0,
      target:target,
      qty:Number(p.qty)||0,
      suggest:suggest,
      cost:Number(p.cost)||0,
      price:Number(p.price)||0,
      totalCost:(Number(p.qty)||0)*(Number(p.cost)||0),
      note:p.note||''
    });
    
    row.height=60;
    row.alignment={vertical:'middle'};
    
    if(p.image&&p.image.startsWith('data:image')){
      try{
        const base64Data=p.image.split(',')[1];
        const imageId=workbook.addImage({ base64:base64Data, extension:'jpeg' });
        worksheet.addImage(imageId,{ tl:{col:0,row:i+1}, ext:{width:80,height:80}, editAs:'oneCell' });
      }catch(err){ console.warn('图片嵌入失败：',err); }
    }
  }
  
  const wsRecords=workbook.addWorksheet('出入库流水');
  wsRecords.columns=[
    {header:'时间',key:'time',width:20},
    {header:'商品名称',key:'name',width:22},
    {header:'类型',key:'type',width:10},
    {header:'数量',key:'qty',width:10},
    {header:'变动前库存',key:'before',width:12},
    {header:'变动后库存',key:'after',width:12},
    {header:'备注',key:'note',width:20}
  ];
  const recHeader=wsRecords.getRow(1);
  recHeader.font={bold:true,color:{argb:'FFFFFFFF'}};
  recHeader.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2E7D6B'}};
  
  records.forEach(r=>{
    wsRecords.addRow({
      time:fmtTime(r.time), name:r.name, type:r.type==='in'?'入库':'出库',
      qty:r.qty, before:r.before, after:r.after, note:r.note||''
    });
  });
  
  const buffer=await workbook.xlsx.writeBuffer();
  const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const d=new Date();
  saveAs(blob,`青禾库存_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.xlsx`);
  toast('Excel 导出成功！');
}

function getRestockList(){
  let lowItems=items.filter(p=>{
    const min = Number(p.min) || 0;
    const qty = Number(p.qty) || 0;
    const target = Number(p.target) || min * 2 || 10;
    return (min > 0 && qty <= min) || (min === 0 && qty < target - 1);
  });
  lowItems = lowItems.filter(p => !hiddenRestockIds.has(p.id));
  if(restockCatFilter){ lowItems=lowItems.filter(p=>p.cat===restockCatFilter); }
  return lowItems;
}

function importData(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);
      if(!data||!Array.isArray(data.items))throw new Error('文件格式不正确');
      if(!confirm('导入会覆盖当前所有数据，确定继续吗？')){e.target.value='';return}
      items=data.items;
      records=Array.isArray(data.records)?data.records:[];
      save();renderPage();toast('导入成功');
    }catch(err){toast('导入失败：'+err.message)}
    e.target.value='';
  };
  reader.readAsText(file);
}
